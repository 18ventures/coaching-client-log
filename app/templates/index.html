<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Client Call Log</title>

<!-- Add to Home Screen support -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0B0D10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Client Log">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0D10; --panel: #14171C; --panel-raised: #1A1E24; --hairline: #262B33;
    --text: #E8E6DE; --text-dim: #8A8F98; --text-faint: #565B63;
    --gold: #C9A227; --gold-soft: rgba(201,162,39,0.14); --green: #3ECF8E; --green-soft: rgba(62,207,142,0.14);
    --rust: #C1553B;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--text); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  header{
    padding: 22px 28px 18px; border-bottom:1px solid var(--hairline);
    background: linear-gradient(180deg, rgba(201,162,39,0.05), transparent);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin:0 0 6px; }
  h1{ margin:0; font-size:22px; font-weight:800; letter-spacing:-0.01em; }
  .btn{ background: var(--gold); color:#14171C; border:none; padding:9px 16px; border-radius:7px; font-weight:700; font-size:13px; cursor:pointer; }
  .btn:hover{ opacity:0.88; }
  .btn-ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--hairline); padding:9px 16px; border-radius:7px; font-size:13px; cursor:pointer; }
  .btn-ghost:hover{ color:var(--text); border-color:var(--text-faint); }
  .btn-sm{ padding:6px 10px; font-size:12px; border-radius:6px; }
  .layout{ display:flex; min-height: calc(100vh - 84px); }
  .sidebar{ width:250px; border-right:1px solid var(--hairline); padding:16px 12px; flex-shrink:0; overflow-y:auto; }
  .sidebar-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); margin-bottom:10px; padding:0 6px; }
  .client-item{ padding:10px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; }
  .client-item:hover{ background: var(--panel); }
  .client-item.active{ background: var(--gold-soft); border-color: var(--gold); }
  .client-item-name{ font-weight:600; font-size:13px; }
  .client-item-sub{ font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono', monospace; margin-top:2px; }
  .client-item-sub .not-scheduled{ color: var(--rust); font-weight:600; }

  .client-meta-row{ display:flex; gap:8px; margin: 2px 0 18px; flex-wrap:wrap; }
  .meta-badge{
    font-family:'IBM Plex Mono', monospace; font-size:11px; padding:5px 10px; border-radius:20px;
    background: var(--panel-raised); border:1px solid var(--hairline); color:var(--text-dim);
  }
  .meta-badge.not-scheduled{ background: rgba(193,85,59,0.12); border-color: var(--rust); color: var(--rust); font-weight:600; }
  .empty-side{ color:var(--text-faint); font-size:12px; padding:10px 6px; }
  .main{ flex:1; padding: 22px 30px 60px; max-width:800px; }

  .client-head{ display:flex; gap:12px; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; }
  .client-head input, .client-head select{ background: var(--panel-raised); border:1px solid var(--hairline); color:var(--text); padding:9px 12px; border-radius:7px; font-size:14px; outline:none; }
  .client-head input:focus, .client-head select:focus{ border-color: var(--gold); }
  .client-head label{ display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px; }

  .session-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin: 14px 0 20px; align-items:center; }
  .session-tab{ padding:7px 12px; border-radius:20px; border:1px solid var(--hairline); background: var(--panel-raised); color:var(--text-dim); font-size:12px; cursor:pointer; font-family:'IBM Plex Mono', monospace; }
  .session-tab.active{ background: var(--gold); color:#14171C; border-color:var(--gold); font-weight:700; }
  .session-tab:hover:not(.active){ border-color: var(--text-faint); color:var(--text); }

  .field-group{ margin-bottom:18px; }
  label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  input[type=text], input[type=date], textarea, select{
    width:100%; background: var(--panel-raised); border:1px solid var(--hairline); color:var(--text);
    padding:10px 12px; border-radius:7px; font-size:14px; font-family:'Inter',sans-serif; outline:none; resize: vertical;
  }
  input:focus, textarea:focus, select:focus{ border-color: var(--gold); }
  textarea{ min-height:70px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .section-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold); margin:26px 0 14px; padding-top:14px; border-top:1px solid var(--hairline); }
  .section-title:first-of-type{ border-top:none; padding-top:0; margin-top:4px; }
  .scale-row{ display:flex; gap:6px; }
  .scale-btn{ flex:1; padding:8px 0; text-align:center; border:1px solid var(--hairline); border-radius:6px; background: var(--panel-raised); color:var(--text-dim); cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .scale-btn.selected{ background: var(--gold); color:#14171C; border-color:var(--gold); font-weight:700; }
  .save-row{ display:flex; gap:10px; margin-top:24px; align-items:center; flex-wrap:wrap; }
  .save-status{ font-size:12px; color:var(--text-faint); font-family:'IBM Plex Mono', monospace; }

  .action-list{ margin-bottom:10px; }
  .action-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--hairline); border-radius:7px; margin-bottom:6px; background: var(--panel-raised); }
  .action-item.done .action-desc{ text-decoration: line-through; color: var(--text-faint); }
  .action-check{ width:18px; height:18px; border-radius:5px; border:1px solid var(--hairline); background:transparent; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; color: var(--green); font-size:12px; }
  .action-check.checked{ background: var(--green-soft); border-color: var(--green); }
  .action-desc{ flex:1; font-size:13px; }
  .action-owner{ font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); font-family:'IBM Plex Mono', monospace; padding:2px 6px; border:1px solid var(--hairline); border-radius:10px; }
  .action-del{ background:transparent; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 6px; }
  .action-del:hover{ color: var(--rust); }
  .add-action-row{ display:flex; gap:8px; }
  .add-action-row input{ flex:1; }
  .add-action-row select{ width:110px; flex-shrink:0; }

  .modal-overlay{ position:fixed; inset:0; background: rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-overlay.open{ display:flex; }
  .modal{ background: var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:22px; max-width:560px; width:100%; max-height:80vh; display:flex; flex-direction:column; }
  .modal-title{ font-size:15px; font-weight:700; margin-bottom:12px; }
  .modal textarea{ flex:1; min-height:320px; font-family:'IBM Plex Mono', monospace; font-size:13px; line-height:1.5; }
  .modal-actions{ display:flex; gap:10px; margin-top:14px; justify-content:flex-end; }

  .empty-main{ color: var(--text-faint); font-size:13px; padding:40px 10px; text-align:center; }

  .scan-notes-box{ background: var(--panel); border:1px dashed var(--hairline); border-radius:10px; padding:14px; margin: 4px 0 22px; }
  .scan-notes-label{ font-size:12px; color:var(--text-dim); margin-bottom:8px; }
  .scan-notes-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .scan-notes-row input[type=file]{ font-size:12px; color:var(--text-dim); max-width:100%; }
  .scan-status{ font-size:12px; color:var(--gold); font-family:'IBM Plex Mono', monospace; }
  .scan-status.error{ color: var(--rust); }
  .scan-status.success{ color: var(--green); }
</style>
</head>
<body>

<header>
  <div>
    <p class="eyebrow">// discovery &amp; coaching calls · client log</p>
    <h1 id="headerTitle">Client Log</h1>
  </div>
  <div style="display:flex; gap:8px;">
    <a class="btn-ghost" href="/api/export" style="text-decoration:none; display:inline-block;">Export CSV</a>
    <button class="btn-ghost" onclick="newClientPrompt()">+ New client</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">Clients</div>
    <div id="clientList"></div>
  </div>

  <div class="main" id="mainArea">
    <div class="empty-main">Select a client, or add a new one.</div>
  </div>
</div>

<div class="modal-overlay" id="summaryModal">
  <div class="modal">
    <div class="modal-title">Call summary — copy &amp; send</div>
    <textarea id="summaryText" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeSummary()">Close</button>
      <button class="btn" onclick="copySummary()">Copy to clipboard</button>
    </div>
  </div>
</div>

<script>
let clients = [];
let currentClientId = null;
let currentSessionId = null; // null = unsaved new session
let currentSessionData = null;
let currentScale = null;
let currentSessionType = 'discovery'; // 'discovery' (session 1) or 'followup' (session 2+)
let currentClientSessionCount = 0;
let pendingActionItems = []; // action items suggested by a notes scan, not yet persisted

const DISCOVERY_FIELD_MAP = {
  s_session_date: 'session_date', s_next_session_date: 'next_session_date',
  s_pain: 'pain', s_duration: 'duration', s_why_now: 'why_now', s_tried: 'tried',
  s_outcome: 'outcome', s_technique: 'technique',
  s_goal_1: 'goal_1', s_goal_2: 'goal_2', s_goal_detail: 'goal_detail', s_goal_why: 'goal_why',
  s_work_what: 'work_what', s_work_stop: 'work_stop',
  s_cadence: 'cadence', s_excited: 'excited', s_notes: 'notes'
};

const FOLLOWUP_FIELD_MAP = {
  s_session_date: 'session_date', s_next_session_date: 'next_session_date',
  s_progress_review: 'progress_review', s_win: 'win', s_obstacles: 'obstacles',
  s_goal_shift: 'goal_shift', s_goal_1: 'goal_1', s_goal_2: 'goal_2',
  s_session_focus: 'session_focus', s_technique: 'technique',
  s_notes: 'notes'
};

function fieldMapFor(type){
  return type === 'followup' ? FOLLOWUP_FIELD_MAP : DISCOVERY_FIELD_MAP;
}

// ---------------- Notes photo scanning ----------------

async function handleNotesPhoto(){
  const input = document.getElementById('notesPhotoInput');
  const statusEl = document.getElementById('scanStatus');
  const file = input.files[0];
  if(!file) return;

  statusEl.className = 'scan-status';
  statusEl.textContent = 'Reading notes...';

  const formData = new FormData();
  formData.append('file', file);
  formData.append('session_type', currentSessionType);

  try{
    const res = await fetch('/api/parse-notes', { method: 'POST', body: formData });
    if(!res.ok){
      const err = await res.json().catch(() => ({detail: 'Unknown error'}));
      throw new Error(err.detail || 'Parse failed');
    }
    const parsed = await res.json();

    // Populate whichever fields exist in the current form (discovery or followup)
    Object.entries(fieldMapFor(currentSessionType)).forEach(([domId, key]) => {
      const el = document.getElementById(domId);
      if(el && parsed[key]){
        el.value = parsed[key];
      }
    });

    if(currentSessionType === 'discovery' && parsed.cost_scale){
      setScale(parseInt(parsed.cost_scale));
    }

    // Queue up suggested action items for review — don't save them yet. They're
    // flushed to the server together with the rest of the session when the user
    // clicks "Save session", so nothing is written until they've reviewed it.
    if(Array.isArray(parsed.action_items) && parsed.action_items.length > 0){
      const newPending = parsed.action_items
        .filter(item => item.description)
        .map(item => ({ description: item.description, owner: item.owner === 'coach' ? 'coach' : 'client' }));
      pendingActionItems = pendingActionItems.concat(newPending);
      renderActionList((currentSessionData && currentSessionData.action_items) || []);
    }

    statusEl.className = 'scan-status success';
    statusEl.textContent = 'Notes read — review the fields below, then Save session.';
  }catch(e){
    console.error(e);
    statusEl.className = 'scan-status error';
    statusEl.textContent = 'Could not read notes: ' + e.message;
  }
}

// ---------------- Clients ----------------

async function loadClients(){
  const res = await fetch('/api/clients');
  clients = await res.json();
  renderClientList();
  if(currentClientId){
    const stillExists = clients.find(c => c.id === currentClientId);
    if(!stillExists) currentClientId = null;
  }
}

function renderClientList(){
  const list = document.getElementById('clientList');
  list.innerHTML = '';
  if(clients.length === 0){
    list.innerHTML = '<div class="empty-side">No clients yet</div>';
    return;
  }
  clients.forEach(c => {
    const el = document.createElement('div');
    el.className = 'client-item' + (c.id === currentClientId ? ' active' : '');
    el.onclick = () => selectClient(c.id);

    const sessions = (c.sessions || []).slice().sort((a,b) => (b.session_date||'').localeCompare(a.session_date||''));
    const sessionCount = sessions.length;
    const callLabel = sessionCount + ' call' + (sessionCount === 1 ? '' : 's');

    // "Next scheduled" reflects what was set at the most recent session — not the
    // earliest next_session_date ever recorded, which could be stale/in the past.
    const latestSession = sessions[0];
    const nextDate = latestSession ? latestSession.next_session_date : null;

    const nextHtml = nextDate
      ? `<span>Next: ${nextDate}</span>`
      : `<span class="not-scheduled">Not scheduled</span>`;

    el.innerHTML = `
      <div class="client-item-name">${escapeHtml(c.name || 'Untitled')}</div>
      <div class="client-item-sub">${callLabel} · ${nextHtml}</div>
    `;
    list.appendChild(el);
  });
}

async function newClientPrompt(){
  const name = prompt('Client name?');
  if(!name || !name.trim()) return;
  const res = await fetch('/api/clients', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: name.trim(), source: 'Referral' })
  });
  const client = await res.json();
  await loadClients();
  selectClient(client.id);
}

async function selectClient(id){
  currentClientId = id;
  currentSessionId = null;
  currentSessionData = null;
  renderClientList();
  const res = await fetch('/api/clients/' + id);
  const client = await res.json();
  renderMain(client);
}

function renderMain(client){
  const main = document.getElementById('mainArea');
  document.getElementById('headerTitle').textContent = client.name || 'Client';

  const sessions = (client.sessions || []).slice().sort((a,b) => (b.session_date||'').localeCompare(a.session_date||''));
  currentClientSessionCount = sessions.length;

  const callLabel = sessions.length + ' call' + (sessions.length === 1 ? '' : 's');
  const latestSession = sessions[0];
  const nextDate = latestSession ? latestSession.next_session_date : null;
  const nextBadgeHtml = nextDate
    ? `<span class="meta-badge">Next call: ${nextDate}</span>`
    : `<span class="meta-badge not-scheduled">Not scheduled</span>`;

  main.innerHTML = `
    <div class="client-head">
      <div>
        <label>Client name</label>
        <input type="text" id="c_name" value="${escapeAttr(client.name||'')}">
      </div>
      <div>
        <label>Referral source</label>
        <select id="c_source">
          ${['Referral','Warm intro','Friend','Family','Social media','Community/forum','Cold outreach','Networking event','Other']
            .map(s => `<option ${client.source===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <button class="btn-ghost btn-sm" onclick="saveClientBasics()">Save</button>
      <button class="btn-ghost btn-sm" onclick="deleteClient()">Delete client</button>
    </div>

    <div class="client-meta-row">
      <span class="meta-badge">${callLabel}</span>
      ${nextBadgeHtml}
    </div>

    <div class="session-tabs" id="sessionTabs"></div>
    <div id="sessionFormArea"></div>
  `;

  const tabsEl = document.getElementById('sessionTabs');
  sessions.forEach(s => {
    const tab = document.createElement('div');
    tab.className = 'session-tab' + (s.id === currentSessionId ? ' active' : '');
    const typeLabel = s.session_type === 'followup' ? '' : ' (intake)';
    tab.textContent = (s.session_date || 'Undated') + typeLabel;
    tab.onclick = () => loadSession(s.id);
    tabsEl.appendChild(tab);
  });
  const newTab = document.createElement('div');
  newTab.className = 'session-tab';
  newTab.textContent = '+ New session';
  newTab.onclick = () => newSession();
  tabsEl.appendChild(newTab);

  if(sessions.length > 0 && currentSessionId === null){
    loadSession(sessions[0].id);
  } else if(sessions.length === 0){
    newSession();
  } else if(currentSessionId) {
    loadSession(currentSessionId);
  }
}

async function saveClientBasics(){
  const name = document.getElementById('c_name').value;
  const source = document.getElementById('c_source').value;
  await fetch('/api/clients/' + currentClientId, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, source })
  });
  await loadClients();
  document.getElementById('headerTitle').textContent = name;
}

async function deleteClient(){
  if(!confirm('Delete this client and all their session history? This cannot be undone.')) return;
  await fetch('/api/clients/' + currentClientId, { method:'DELETE' });
  currentClientId = null;
  currentSessionId = null;
  await loadClients();
  document.getElementById('mainArea').innerHTML = '<div class="empty-main">Select a client, or add a new one.</div>';
  document.getElementById('headerTitle').textContent = 'Client Log';
}

// ---------------- Sessions ----------------

function sessionFormHTML(type){
  const commonHead = `
    <div class="section-title">Session</div>
    <div class="field-group row2">
      <div><label>Session date</label><input type="date" id="s_session_date"></div>
      <div><label>Next session date</label><input type="date" id="s_next_session_date"></div>
    </div>

    <div class="scan-notes-box">
      <div class="scan-notes-label">Have handwritten notes from this session?</div>
      <div class="scan-notes-row">
        <input type="file" id="notesPhotoInput" accept="image/*" capture="environment" onchange="handleNotesPhoto()">
        <span class="scan-status" id="scanStatus"></span>
      </div>
    </div>
  `;

  const commonTail = `
    <div class="section-title">Action Items</div>
    <div class="action-list" id="actionList"></div>
    <div class="add-action-row">
      <input type="text" id="newActionText" placeholder="e.g. Write down 3 priorities before Tuesday" onkeydown="if(event.key==='Enter'){addAction();}">
      <select id="newActionOwner"><option value="client">Client</option><option value="coach">Coach</option></select>
      <button class="btn-ghost btn-sm" onclick="addAction()">Add</button>
    </div>

    <div class="save-row">
      <button class="btn" onclick="saveSession()">Save session</button>
      <button class="btn-ghost" onclick="generateSummary()">Generate summary</button>
      <button class="btn-ghost" id="deleteSessionBtn" onclick="deleteSession()" style="display:none;">Delete session</button>
      <span class="save-status" id="saveStatus"></span>
    </div>
  `;

  if(type === 'followup'){
    return commonHead + `
      <div class="section-title">Reviewing Last Session</div>
      <div class="field-group"><label>What did they actually do since we last spoke?</label><textarea id="s_progress_review" placeholder="Review against the action items from last session"></textarea></div>
      <div class="field-group"><label>Biggest win since last session</label><textarea id="s_win" placeholder="However small — worth naming and reinforcing"></textarea></div>
      <div class="field-group"><label>What got in the way / didn't happen?</label><textarea id="s_obstacles" placeholder="What blocked progress — time, energy, avoidance, life events"></textarea></div>

      <div class="section-title">Goals Check-in</div>
      <div class="field-group"><label>Any shift in their goals, or new goals surfacing?</label><textarea id="s_goal_shift" placeholder="Has the target moved since intake, or since last session?"></textarea></div>
      <div class="field-group row2">
        <div><label>Goal #1 (current)</label><input type="text" id="s_goal_1"></div>
        <div><label>Goal #2 (current)</label><input type="text" id="s_goal_2"></div>
      </div>

      <div class="section-title">This Session</div>
      <div class="field-group"><label>What are we focusing on today, and why?</label><textarea id="s_session_focus"></textarea></div>
      <div class="field-group"><label>Approach / technique used today</label><textarea id="s_technique"></textarea></div>

      <div class="section-title">Notes</div>
      <div class="field-group"><label>Other notes</label><textarea id="s_notes"></textarea></div>
    ` + commonTail;
  }

  // discovery (session 1)
  return commonHead + `
    <div class="section-title">The Pain Point</div>
    <div class="field-group"><label>Main struggle (their words)</label><textarea id="s_pain"></textarea></div>
    <div class="field-group"><label>How long has this been going on?</label><input type="text" id="s_duration" placeholder="e.g. 2 years, on and off"></div>
    <div class="field-group"><label>Why now? (what changed / what prompted the call)</label><textarea id="s_why_now"></textarea></div>
    <div class="field-group"><label>What have they already tried?</label><textarea id="s_tried"></textarea></div>
    <div class="field-group">
      <label>Cost of inaction (1-10)</label>
      <div class="scale-row" id="scaleRow"></div>
    </div>

    <div class="section-title">What We Could Achieve Together</div>
    <div class="field-group"><label>Goal #1</label><input type="text" id="s_goal_1" placeholder="Their top goal, in a sentence"></div>
    <div class="field-group"><label>Goal #2</label><input type="text" id="s_goal_2" placeholder="Their second goal, in a sentence"></div>
    <div class="field-group"><label>What does achieving this actually look like day-to-day?</label><textarea id="s_goal_detail"></textarea></div>
    <div class="field-group"><label>Why does this goal matter to them?</label><textarea id="s_goal_why"></textarea></div>
    <div class="field-group"><label>Desired outcome in 3 months</label><textarea id="s_outcome"></textarea></div>
    <div class="field-group"><label>Approach / technique discussed</label><textarea id="s_technique"></textarea></div>

    <div class="section-title">Their Work</div>
    <div class="field-group"><label>What do they do? (role, industry, work pattern)</label><textarea id="s_work_what"></textarea></div>
    <div class="field-group"><label>What do they want to stop doing / do less of?</label><textarea id="s_work_stop"></textarea></div>

    <div class="section-title">Logistics &amp; Notes</div>
    <div class="field-group"><label>Preferred cadence / availability</label><input type="text" id="s_cadence"></div>
    <div class="field-group"><label>What would make them genuinely excited to continue?</label><textarea id="s_excited"></textarea></div>
    <div class="field-group"><label>Other notes</label><textarea id="s_notes"></textarea></div>
  ` + commonTail;
}

function buildScale(selected){
  const row = document.getElementById('scaleRow');
  if(!row) return;
  row.innerHTML = '';
  for(let i=1;i<=10;i++){
    const b = document.createElement('div');
    b.className = 'scale-btn' + (selected===i ? ' selected' : '');
    b.textContent = i;
    b.dataset.val = i;
    b.onclick = () => setScale(i);
    row.appendChild(b);
  }
}
function setScale(v){
  currentScale = v;
  document.querySelectorAll('.scale-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.val) === v);
  });
}

function newSession(){
  currentSessionId = null;
  currentSessionType = currentClientSessionCount > 0 ? 'followup' : 'discovery';
  currentSessionData = { action_items: [], session_type: currentSessionType };
  pendingActionItems = [];
  currentScale = null;
  const area = document.getElementById('sessionFormArea');
  area.innerHTML = sessionFormHTML(currentSessionType);
  document.getElementById('s_session_date').value = new Date().toISOString().slice(0,10);
  if(currentSessionType === 'discovery') buildScale(null);
  renderActionList([]);
  document.getElementById('deleteSessionBtn').style.display = 'none';
  document.getElementById('saveStatus').textContent = '';
  highlightActiveTab();
}

async function loadSession(id){
  pendingActionItems = [];
  const res = await fetch('/api/sessions/' + id);
  if(!res.ok) return;
  const s = await res.json();
  currentSessionId = id;
  currentSessionData = s;
  currentSessionType = s.session_type || 'discovery';
  currentScale = s.cost_scale || null;
  const area = document.getElementById('sessionFormArea');
  area.innerHTML = sessionFormHTML(currentSessionType);
  Object.entries(fieldMapFor(currentSessionType)).forEach(([domId, key]) => {
    const el = document.getElementById(domId);
    if(el) el.value = s[key] || '';
  });
  if(currentSessionType === 'discovery') buildScale(currentScale);
  renderActionList(s.action_items || []);
  document.getElementById('deleteSessionBtn').style.display = 'inline-block';
  document.getElementById('saveStatus').textContent = '';
  highlightActiveTab();
}

function highlightActiveTab(){
  document.querySelectorAll('.session-tab').forEach(t => t.classList.remove('active'));
  if(currentSessionId){
    const tabs = document.querySelectorAll('.session-tab');
    const typeLabel = currentSessionType === 'followup' ? '' : ' (intake)';
    const expected = (currentSessionData && currentSessionData.session_date || '') + typeLabel;
    tabs.forEach(t => {
      if(t.textContent === expected) t.classList.add('active');
    });
  }
}

async function saveSession(){
  const payload = { session_type: currentSessionType, cost_scale: currentScale };
  Object.entries(fieldMapFor(currentSessionType)).forEach(([domId, key]) => {
    const el = document.getElementById(domId);
    payload[key] = el ? el.value : null;
  });
  try{
    let res;
    if(currentSessionId){
      res = await fetch('/api/sessions/' + currentSessionId, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
    } else {
      res = await fetch('/api/clients/' + currentClientId + '/sessions', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
    }
    if(!res.ok) throw new Error('save failed');
    const saved = await res.json();
    currentSessionId = saved.id;
    currentSessionData = saved;

    // Flush any action items queued from a scanned notes photo (or otherwise pending)
    if(pendingActionItems.length > 0){
      for(const item of pendingActionItems){
        await fetch('/api/sessions/' + currentSessionId + '/actions', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ description: item.description, owner: item.owner, done: false })
        });
      }
      pendingActionItems = [];
    }

    await loadClients();
    const clientRes = await fetch('/api/clients/' + currentClientId);
    const client = await clientRes.json();
    renderMain(client);
    document.getElementById('saveStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
  }catch(e){
    console.error(e);
    document.getElementById('saveStatus').textContent = 'Save failed';
  }
}

async function deleteSession(){
  if(!currentSessionId) return;
  if(!confirm('Delete this session? This cannot be undone.')) return;
  await fetch('/api/sessions/' + currentSessionId, { method:'DELETE' });
  currentSessionId = null;
  await loadClients();
  const clientRes = await fetch('/api/clients/' + currentClientId);
  const client = await clientRes.json();
  renderMain(client);
}

// ---------------- Action items ----------------

function renderActionList(items){
  const list = document.getElementById('actionList');
  if(!list) return;
  list.innerHTML = '';
  const saved = items || [];
  if(saved.length === 0 && pendingActionItems.length === 0){
    list.innerHTML = '<div style="color:var(--text-faint); font-size:12px; padding:4px 2px;">No action items yet.</div>';
    return;
  }
  saved.forEach(item => {
    const el = document.createElement('div');
    el.className = 'action-item' + (item.done ? ' done' : '');
    el.innerHTML = `
      <div class="action-check ${item.done ? 'checked' : ''}" onclick="toggleAction(${item.id}, ${!item.done})">${item.done ? '✓' : ''}</div>
      <div class="action-desc">${escapeHtml(item.description)}</div>
      <div class="action-owner">${item.owner || 'client'}</div>
      <button class="action-del" onclick="deleteAction(${item.id})">✕</button>
    `;
    list.appendChild(el);
  });
  pendingActionItems.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'action-item';
    el.style.opacity = '0.7';
    el.style.borderStyle = 'dashed';
    el.innerHTML = `
      <div class="action-check" title="Save the session to add this"></div>
      <div class="action-desc">${escapeHtml(item.description)}</div>
      <div class="action-owner">${item.owner} · from notes</div>
      <button class="action-del" onclick="removePendingAction(${idx})">✕</button>
    `;
    list.appendChild(el);
  });
}

function removePendingAction(idx){
  pendingActionItems.splice(idx, 1);
  renderActionList((currentSessionData && currentSessionData.action_items) || []);
}

async function addAction(){
  const input = document.getElementById('newActionText');
  const desc = input.value.trim();
  if(!desc) return;
  const owner = document.getElementById('newActionOwner').value;

  if(!currentSessionId){
    // save the session first so we have an id to attach the action to
    await saveSession();
    if(!currentSessionId) return;
  }
  const res = await fetch('/api/sessions/' + currentSessionId + '/actions', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ description: desc, owner, done: false })
  });
  const action = await res.json();
  currentSessionData.action_items = currentSessionData.action_items || [];
  currentSessionData.action_items.push(action);
  input.value = '';
  renderActionList(currentSessionData.action_items);
}

async function toggleAction(id, newDone){
  await fetch('/api/actions/' + id, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ done: newDone })
  });
  const item = currentSessionData.action_items.find(a => a.id === id);
  if(item) item.done = newDone;
  renderActionList(currentSessionData.action_items);
}

async function deleteAction(id){
  await fetch('/api/actions/' + id, { method:'DELETE' });
  currentSessionData.action_items = currentSessionData.action_items.filter(a => a.id !== id);
  renderActionList(currentSessionData.action_items);
}

// ---------------- Summary generator ----------------

function generateSummary(){
  const client = clients.find(c => c.id === currentClientId);
  const clientName = client ? client.name : 'there';
  const items = ((currentSessionData && currentSessionData.action_items) || []).concat(pendingActionItems);

  const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

  const goal1 = get('s_goal_1');
  const goal2 = get('s_goal_2');
  const nextDate = get('s_next_session_date');

  const clientActions = items.filter(a => (a.owner || 'client') === 'client');
  const coachActions = items.filter(a => a.owner === 'coach');

  const bulletsOrPlaceholder = (arr, placeholder) =>
    arr.length ? arr.map(t => `- ${t}`).join('\n') : `- ${placeholder}`;

  let text = `Hi ${clientName},\n\nGreat session today — here's a quick recap so we're aligned before we next speak.\n\n`;

  text += `WHERE WE'RE AT\n`;
  const whereAt = [];
  if(currentSessionType === 'followup'){
    const win = get('s_win');
    const obstacles = get('s_obstacles');
    const progress = get('s_progress_review');
    if(win) whereAt.push(`Win since last time: ${win}`);
    if(progress) whereAt.push(progress);
    if(obstacles) whereAt.push(`What got in the way: ${obstacles}`);
  } else {
    const pain = get('s_pain');
    const workStop = get('s_work_stop');
    if(pain) whereAt.push(pain);
    if(workStop) whereAt.push(`Looking to do less of: ${workStop}`);
  }
  text += bulletsOrPlaceholder(whereAt, '(add session notes to populate this)') + `\n\n`;

  text += `YOUR GOALS\n`;
  const goals = [goal1, goal2].filter(Boolean);
  text += bulletsOrPlaceholder(goals, '(add goal #1 / #2 to populate this)') + `\n\n`;

  text += `YOUR NEXT STEPS\n`;
  text += bulletsOrPlaceholder(clientActions.map(a => a.description), '(no client action items added yet)') + `\n\n`;

  text += `MY NEXT STEPS\n`;
  text += bulletsOrPlaceholder(coachActions.map(a => a.description), '(no coach action items added yet)') + `\n\n`;

  text += nextDate
    ? `Looking forward to catching up on ${nextDate}.`
    : `Looking forward to catching up next time.`;

  document.getElementById('summaryText').value = text;
  document.getElementById('summaryModal').classList.add('open');
}

function closeSummary(){
  document.getElementById('summaryModal').classList.remove('open');
}

function copySummary(){
  const ta = document.getElementById('summaryText');
  ta.select();
  document.execCommand('copy');
  const btn = event.target;
  const original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.textContent = original; }, 1500);
}

// ---------------- Helpers ----------------

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}
function escapeAttr(s){
  return (s || '').replace(/"/g, '&quot;');
}

loadClients();
</script>
